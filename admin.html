<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - إبداع سوفت</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121824;
      --card-bg: #1e2638;
      --card-border: #2e3a52;
      --primary: #00b887;
      --primary-hover: #00966d;
      --text-main: #f0f4f8;
      --text-muted: #a0aec0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: var(--primary-hover);
    }

    #error-msg {
      color: #ff5252;
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>تسجيل الدخول</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
      </div>
      
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required placeholder="أدخل كلمة المرور">
      </div>

      <button type="submit" class="btn-login">دخول</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // هنا نحتاج ربط الـ API للتحقق وتسجيل الدخول
    });
  </script>

</body>
</html>
