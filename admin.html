<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول لوحة الإدارة - إبداع سوفت</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121824;
      --card-bg: #1e2638;
      --card-border: #2e3a52;
      --primary: #00b887;
      --primary-hover: #00966d;
      --text-main: #f0f4f8;
      --text-muted: #a0aec0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .back-home {
      position: absolute;
      top: 25px;
      right: 25px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: 0.3s;
    }

    .back-home:hover {
      color: var(--primary);
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      color: var(--primary);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: var(--primary-hover);
    }

    #error-msg {
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home">← العودة للرئيسية</a>

  <div class="login-card">
    <div class="login-header">
      <h2>لوحة الإدارة</h2>
      <p>أدخل بيانات الحساب لتسجيل الدخول</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
      </div>
      
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required placeholder="أدخل كلمة المرور">
      </div>

      <button type="submit" class="btn-login">تسجيل الدخول</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const errorMsgDiv = document.getElementById('error-msg');
      
      errorMsgDiv.style.color = 'var(--text-muted)';
      errorMsgDiv.textContent = 'جاري التحقق من البيانات...';

      try {
        const response = await fetch('https://localhost:7264/api/Login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput
          })
        });

        if (response.ok) {
          errorMsgDiv.style.color = '#00b887';
          errorMsgDiv.textContent = 'تم تسجيل الدخول بنجاح، جاري التحويل...';
          
          // الانتقال لصفحة لوحة التحكم بعد نجاح المصادقة
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          errorMsgDiv.style.color = '#ff5252';
          errorMsgDiv.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
        }
      } catch (error) {
        errorMsgDiv.style.color = '#ff5252';
        errorMsgDiv.textContent = 'تعذر الاتصال بالخادم المحلي (API). تأكد من تشغيله.';
      }
    });
  </script>

</body>
</html>
