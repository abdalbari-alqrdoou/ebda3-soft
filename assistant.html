<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي المتكامل – إبداع سوفت</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2333;
      --bg-input: #21262d;
      --border: #30363d;
      --accent: #2ea043;
      --accent-hover: #3fb950;
      --accent-glow: rgba(46,160,67,0.25);
      --blue: #388bfd;
      --blue-soft: rgba(56,139,253,0.15);
      --user-bubble: #1f4068;
      --bot-bubble: #1c2333;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-msg: 16px;
      --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); overflow: hidden; }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 950px;
      margin: 0 auto;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative;
    }

    /* Modal / Lead Generation */
    #leadModal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      animation: modalIn .3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); text-align: center; }
    .modal-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; text-align: center; line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13.5px;
      outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity .2s;
    }
    .submit-btn:hover { opacity: 0.9; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub { font-size: 11px; color: var(--accent); }
    
    .back-home-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .back-home-btn:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }

    /* Chips Bar */
    .chips-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
    }
    .chip {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--blue);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      font-weight: 600;
    }
    .chip:hover { background: var(--blue-soft); border-color: var(--blue); color: #fff; transform: translateY(-1px); }

    /* Chat Body */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { display: flex; align-items: flex-start; gap: 10px; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .msg.bot .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--blue)); }
    .msg.user .msg-avatar { background: var(--user-bubble); }
    .msg-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius-msg);
      font-size: 13.5px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.bot .msg-bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-top-right-radius: 4px; }
    .msg.user .msg-bubble { background: var(--user-bubble); border-top-left-radius: 4px; }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .activity-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .activity-btn:hover { border-color: var(--accent); background: rgba(46,160,67,0.1); color: var(--accent); }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46,160,67,0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-decoration: none;
      margin-top: 6px;
      margin-right: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .rating-stars { display: flex; gap: 5px; margin-top: 8px; font-size: 20px; cursor: pointer; }
    .rating-stars span { transition: transform 0.2s; }
    .rating-stars span:hover { transform: scale(1.2); }

    /* Input Bar */
    .input-bar {
      padding: 12px 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13.5px;
      resize: none;
      max-height: 100px;
    }
    .send-btn {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Lead Generation Modal -->
  <div id="leadModal">
    <div class="modal-card">
      <div class="modal-title">مرحباً بك في إبداع سوفت</div>
      <div class="modal-sub">يرجى تسجيل بياناتك لنتمكن من تقديم الاستشارة التقنية وتوجيهك للنظام المناسب بدقة.</div>
      <div class="form-group">
        <label class="form-label">الاسم الكريم</label>
        <input type="text" id="clientName" class="form-input" value="م. عبدالباري القردوع">
      </div>
      <div class="form-group">
        <label class="form-label">رقم الهاتف (واتساب)</label>
        <input type="text" id="clientPhone" class="form-input" value="776724021">
      </div>
      <div class="form-group">
        <label class="form-label">المدينة</label>
        <input type="text" id="clientCity" class="form-input" value="الحديدة">
      </div>
      <button class="submit-btn" onclick="initAssistant()">دخول المساعد الذكي</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="header-icon">🤖</div>
      <div>
        <div class="header-title">المساعد الذكي – إبداع سوفت</div>
        <div class="header-sub">متصل الآن · نظام الخبير الموحد</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <span style="font-size: 12px; color: var(--text-secondary);" id="userHeaderInfo"></span>
      <a href="index.html" class="back-home-btn">🏠 العودة للرئيسية</a>
    </div>
  </header>

  <!-- Chips Bar -->
  <div class="chips-bar">
    <button class="chip" onclick="handleQuickAction('شرح الأنظمة')">📋 شرح الأنظمة</button>
    <button class="chip" onclick="handleQuickAction('إدخال الأصناف')">📦 إدخال الأصناف</button>
    <button class="chip" onclick="handleQuickAction('أسعار الأنظمة')">💰 الأسعار والحاسبة</button>
    <button class="chip" onclick="handleQuickAction('طلب اتصال فوري')">📞 اتصل بي الآن</button>
    <button class="chip" onclick="handleQuickAction('كتالوجات PDF')">📄 البروشورات</button>
    <button class="chip" onclick="handleQuickAction('اختيار النشاط')">🏢 اختيار النشاط</button>
    <button class="chip" onclick="handleQuickAction('قصص النجاح')">⭐ قصص النجاح</button>
    <button class="chip" onclick="handleQuickAction('الدعم الفني')">🛠 الدعم الفني</button>
    <button class="chip" onclick="handleQuickAction('تقييم الخدمة')">🌟 تقييم الخدمة</button>
  </div>

  <!-- Chat Body -->
  <div id="chat"></div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-row">
      <button class="send-btn" onclick="handleSend()">&#9654;</button>
      <textarea id="userInput" placeholder="اكتب استفسارك هنا... (مثال: كيف أدخل الأصناف؟)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSend();}"></textarea>
    </div>
  </div>
</div>

<script>
let clientInfo = { name: '', phone: '', city: '' };

const systemsList = [
  "دوت اكس برو", "المال المحاسبي", "شركات الصرافة", "الصراف بلاس", 
  "الصراف المتقدم", "معارض السيارات", "التاجر المطور", "المستشفيات", 
  "المدارس", "الفنادق", "محطات الكهرباء", "محطات الوقود", 
  "مشاريع المياه", "المطاعم", "الموارد البشرية", "الأصول الثابتة"
];

async function initAssistant() {
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const city = document.getElementById('clientCity').value.trim();

  if(!name || !phone) {
    alert('يرجى إدخال الاسم ورقم الهاتف للمتابعة.');
    return;
  }

  clientInfo = { name, phone, city };
  document.getElementById('userHeaderInfo').textContent = `${name} (${city})`;
  document.getElementById('leadModal').style.display = 'none';

  setTimeout(() => {
    addBotMsg(`أهلاً بك يا <strong>${name}</strong> في شركة إبداع سوفت 🚀\nنقدم حزمة متكاملة من الأنظمة الإدارية والمحاسبية المتقدمة (وفي مقدمتها <strong>دوت اكس برو الإصدار الذهبي V4.5</strong>).\n\nللتواصل المباشر عبر الواتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>\n\nكيف يمكنني مساعدتك اليوم؟`);
    showActivitySelector();
  }, 500);
}

function addBotMsg(htmlContent) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble">${htmlContent}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addUserMsg(text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-avatar">👤</div><div class="msg-bubble">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showActivitySelector() {
  let gridHtml = `<div style="margin-top:8px;">اختر النظام أو النشاط للاطلاع على تفاصيله:</div><div class="activity-grid">`;
  systemsList.forEach(sys => {
    gridHtml += `<button class="activity-btn" onclick="selectSystemDetail('${sys}')">${sys}</button>`;
  });
  gridHtml += `</div>`;
  addBotMsg(gridHtml);
}

function handleQuickAction(action) {
  addUserMsg(action);
  setTimeout(() => {
    if (action === 'اختيار النشاط' || action === 'شرح الأنظمة') {
      let sysHtml = `إليك قائمة أنظمة إبداع سوفت المتاحة، اختر النظام الذي ترغب بمعرفته بالتفصيل ودليل الشاشات:<div class="activity-grid">`;
      systemsList.forEach(sys => {
        sysHtml += `<button class="activity-btn" onclick="selectSystemDetail('${sys}')">${sys}</button>`;
      });
      sysHtml += `</div>`;
      addBotMsg(sysHtml);
    } else if (action === 'إدخال الأصناف') {
      showItemsGuide();
    } else if (action === 'أسعار الأنظمة') {
      addBotMsg(`تختلف أسعار الأنظمة بحسب حجم النشاط (عدد الفروع، نقاط البيع، والمستخدمين).<br><br>🧮 <strong>حاسبة تقدير التكلفة السريعة:</strong><br>` +
        `<button class="action-btn" onclick="runEstimator('1 فرع - مستخدمين اثنين')">حزمة أساسية (فرع واحد)</button>` +
        `<button class="action-btn" onclick="runEstimator('عدة فروع - مستخدمين متعددين')">حزمة شاملة (فروع متعددة)</button>`);
    } else if (action === 'طلب اتصال فوري') {
      addBotMsg(`📞 <strong>خدمة اتصل بي الآن:</strong><br>هل ترغب بأن يقوم مهندس المبيعات والدعم الفني بالاتصال بك فوراً على رقمك المسجل (${clientInfo.phone})؟<br>` +
        `<button class="action-btn" onclick="triggerCallback()">تأكيد طلب الاتصال الفوري</button>`);
    } else if (action === 'كتالوجات PDF') {
      addBotMsg(`📄 يمكنك استعراض تفاصيل دليل نظام "دوت إكس برو" (الإصدار الذهبي V4.5) والشاشات الواردة فيه، أو طلب البروشورات مباشرة عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
    } else if (action === 'قصص النجاح') {
      addBotMsg(`⭐ <strong>قصص النجاح:</strong><br>تفتخر إبداع سوفت بخدمة مئات الشركات، المستشفيات، وكبرى شبكات الصرافة والنشاط التجاري في اليمن وخارجها بكفاءة تقنية عالية واستقرار تام للبيانات.`);
    } else if (action === 'الدعم الفني') {
      addBotMsg(`يمكنك التواصل المباشر مع فريق الدعم الفني لشركة إبداع سوفت عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
    } else if (action === 'تقييم الخدمة') {
      showRatingWidget();
    }
  }, 500);
}

function showItemsGuide() {
  addBotMsg(`📦 <strong>دليل إدخال الأصناف في نظام دوت إكس برو:</strong><br><br>` +
    `<strong>1. إدخال مجموعة الأصناف:</strong><br>` +
    `- المسار: <em>إدارة المخزون > تهيئة المخزون > الأصناف الرئيسية</em>.<br>` +
    `- في حقل شجرة الأصناف الرئيسية، اختر الصنف الرئيسي.<br>` +
    `- سجّل اسم المجموعة، ثم اضغط <strong>إضافة</strong>.<br><br>` +
    `<strong>2. إدخال الوحدات:</strong><br>` +
    `- المسار: <em>إدارة المخزون > تهيئة المخزون > دليل وحدات الأصناف</em>.<br>` +
    `- سجّل الوحدة (مثل: كرتون، حبة)، ثم اضغط <strong>إضافة</strong>.<br><br>` +
    `<strong>3. إدخال الأصناف:</strong><br>` +
    `- المسار: <em>إدارة المخزون > تهيئة المخزون > دليل الأصناف</em>.<br>` +
    `- حدد المجموعة، اسم الصنف، وسعر التكلفة وسعر البيع، ثم اضغط <strong>إضافة</strong>.<br><br>` +
    `لأي استفسار تواصل عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
}

function selectSystemDetail(sysName) {
  addUserMsg(sysName);
  setTimeout(() => {
    if (sysName === "دوت اكس برو") {
      addBotMsg(`📘 <strong>دليل نظام دوت إكس برو (الإصدار الذهبي V4.5) – إبداع سوفت</strong>:\n\n` +
        `- نظام محاسبي وإداري متقدم للرقابة المالية وإدارة المخازن.\n` +
        `- يحتوي على شجرة حسابات مرنة، صلاحيات مستخدمين دقيقة، وحماية متكاملة.\n\n` +
        `للتفاصيل والتهيئة، اضغط على زر <button class="action-btn" onclick="showItemsGuide()">إدخال الأصناف</button> أو تواصل عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
    } else {
      addBotMsg(`لقد اخترت نظام (<strong>${sysName}</strong>). هو أحد الأنظمة المتخصصة ضمن منظومة إبداع سوفت لتلبية احتياجات نشاطك بكفاءة عالية.\n\nلتفاصيل البروشور تواصل عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
    }
  }, 600);
}

function runEstimator(packageType) {
  addUserMsg(`اخترت: ${packageType}`);
  setTimeout(() => {
    addBotMsg(`بناءً على اختيارك لـ (${packageType})، نرشح لك الحزمة المناسبة. لتأكيد التكلفة تواصل معنا عبر واتساب: <a href="https://wa.me/967776724021" target="_blank">967776724021</a>`);
  }, 500);
}

function triggerCallback() {
  addUserMsg('تأكيد طلب الاتصال الفوري');
  setTimeout(() => {
    addBotMsg(`تم تسجيل طلب الاتصال الخاص بك يا ${clientInfo.name} بنجاح، وسيتصل بك فريق المبيعات على الرقم (${clientInfo.phone}) قريباً.`);
  }, 500);
}

function showRatingWidget() {
  addBotMsg(`🌟 ما مدى رضاك عن تجربتك مع المساعد الذكي اليوم؟<div class="rating-stars" onclick="rateService(event)">` +
    `<span data-value="1">⭐</span><span data-value="2">⭐⭐</span><span data-value="3">⭐⭐⭐</span><span data-value="4">⭐⭐⭐⭐</span><span data-value="5">⭐⭐⭐⭐⭐</span></div>`);
}

function rateService(e) {
  const val = e.target.getAttribute('data-value');
  if(val) {
    addUserMsg(`تقييم الخدمة: ${val} نجوم`);
    setTimeout(() => {
      addBotMsg(`شكراً جزيلاً لتقييمك (${val}/5)! يسعدنا دائماً خدمتكم في إبداع سوفت.`);
    }, 400);
  }
}

function handleSend() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  addUserMsg(text);
  input.value = '';

  setTimeout(() => {
    const lowerText = text.toLowerCase();
    if (lowerText.includes("أصناف") || lowerText.includes("اصناف") || lowerText.includes("صنف")) {
      showItemsGuide();
    } else {
