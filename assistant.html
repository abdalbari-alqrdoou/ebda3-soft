<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي - إبداع سوفت</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: #121824;
            color: white;
        }

        .header {
            background: #1e2638;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2e3a52;
            position: relative;
        }

        .header h1 {
            color: #00b887;
            margin-bottom: 5px;
        }

        .back-link {
            position: absolute;
            right: 20px;
            top: 25px;
            color: #a0aec0;
            text-decoration: none;
            font-size: 14px;
            background: #2e3a52;
            padding: 6px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .back-link:hover { color: #fff; background: #00b887; }

        .chat {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
            background: #1e2638;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #2e3a52;
        }

        .messages {
            height: 420px;
            overflow-y: auto;
            background: #151c28;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 14px;
        }

        .bot {
            background: #2e3a52;
            color: #f0f4f8;
            align-self: flex-start;
        }

        .user {
            background: #00b887;
            color: white;
            align-self: flex-end;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #2e3a52;
            background: #151c28;
            color: white;
            font-family: 'Tajawal', sans-serif;
            outline: none;
        }

        input:focus {
            border-color: #00b887;
        }

        button {
            background: #00b887;
            color: white;
            border: 0;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            transition: 0.3s;
        }

        button:hover {
            background: #00966d;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-link">&larr; عودة للرئيسية</a>
        <h1>🤖 المساعد الذكي - إبداع سوفت</h1>
        <p>خبير شرح وتهيئة الأنظمة المحاسبية والإدارية (فرع الحديدة)</p>
    </div>

    <div class="chat">
        <div class="messages" id="messages">
            <div class="msg bot">
                مرحباً بك 👋<br>
                أنا مساعد إبداع سوفت. اسألني عن تهيئة الحسابات، المخازن، أو القيود وسأشرحها لك خطوة بخطوة.
            </div>
        </div>

        <div class="input-box">
            <input id="question" placeholder="اكتب سؤالك هنا (مثلاً: كيف أهيء دليل الحسابات؟)...">
            <button onclick="send()">إرسال</button>
        </div>
    </div>

    <script>
        function send() {
            let qInput = document.getElementById("question");
            let q = qInput.value.trim();
            if (q === "") return;

            let box = document.getElementById("messages");
            
            // رسالة المستخدم
            box.innerHTML += `<div class="msg user">${q}</div>`;
            qInput.value = "";
            box.scrollTop = box.scrollHeight;

            // تحديد الرد بناءً على محتوى السؤال
            setTimeout(() => {
                let answer = "سأساعدك في شرح أنظمة إبداع سوفت وخطوات التهيئة. للمزيد من التفاصيل أو المساعدة المباشرة تواصل معنا عبر واتساب 776724021.";
                
                let text = q.toLowerCase();
                if (text.includes("حساب") || text.includes("شجرة") || text.includes("دليل")) {
                    answer = "<strong>خطوات تهيئة دليل الحسابات:</strong><br>1. افتح قائمة <strong>الحسابات</strong>.<br>2. اختر <strong>دليل الحسابات</strong>.<br>3. انقر على زر (إضافة حساب رئيسي أو فرعي).<br>4. أدخل الرمز واسم الحساب ثم اضغط <strong>حفظ</strong>.";
                } else if (text.includes("مخزن") || text.includes("مستودع") || text.includes("صنف")) {
                    answer = "<strong>خطوات تهيئة المخازن والأصناف:</strong><br>1. افتح نظام <strong>المخازن والمستودعات</strong>.<br>2. اختر <strong>تهيئة المخازن</strong> لإضافة المستودع الرئيسي.<br>3. انتقل إلى <strong>مجموعات الأصناف</strong> وأدخل الوحدات والأسعار ثم احفظ البيانات.";
                } else if (text.includes("قيد") || text.includes("سند") || text.includes("قبض") || text.includes("صرف")) {
                    answer = "<strong>خطوات إدخال السندات والقيود:</strong><br>1. توجه إلى <strong>الحسابات العامة</strong>.<br>2. اختر السند المطلوب (سند قبض / سند صرف / قيد يومية).<br>3. أدخل الأطراف (مدين ودائن) وتأكد من توازن المبلغ ثم اضغط <strong>حفظ وترحيل</strong>.";
                } else if (text.includes("سعر") || text.includes("تواصل") || text.includes("رقم")) {
                    answer = "للاستفسار عن الأسعار أو طلب نزول ميداني لفرع الحديدة، يرجى التواصل مباشرة عبر واتساب: <strong>776724021</strong>.";
                }

                box.innerHTML += `<div class="msg bot">${answer}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 600);
        }

        // تفعيل الضغط على زر Enter للإرسال
        document.getElementById("question").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                send();
            }
        });
    </script>
</body>
</html>
