<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد إبداع سوفت الذكي</title>
<!-- خط تجوال العربي -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family: 'Tajawal', Arial, sans-serif;
background:#121824;
color:white;
text-align:center;
padding:20px;
}

/* زر العودة للرئيسية */
.back-home {
  display: inline-block;
  margin-bottom: 20px;
  color: #00b887;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  transition: 0.3s;
}
.back-home:hover {
  color: #00966d;
  text-decoration: underline;
}

.chat{
width:400px;
max-width:95%;
margin:auto;
background:#1e2638;
padding:20px;
border-radius:15px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

h1{
color:#00b887;
font-size: 24px;
margin-bottom: 15px;
}

.box{
height:350px;
overflow-y:auto;
background:#151c28;
padding:15px;
border-radius:10px;
text-align:right;
margin-bottom: 15px;
border: 1px solid #2e3a52;
}

.input-container {
display: flex;
gap: 8px;
}

input{
flex: 1;
padding:12px;
border-radius:8px;
border:1px solid #2e3a52;
background: #1e2638;
color: white;
font-family: 'Tajawal', sans-serif;
outline: none;
}

input:focus {
border-color: #00b887;
}

button{
padding:12px 20px;
background:#00b887;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
font-weight: bold;
font-family: 'Tajawal', sans-serif;
transition: 0.3s;
}

button:hover{
background:#00966d;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:8px;
background:#2e3a52;
font-size: 14px;
line-height: 1.6;
}

</style>
</head>

<body>

<!-- رابط الرجوع للرئيسية -->
<a href="ebda3soft.html" class="back-home">⬅ العودة للرئيسية</a>

<h1>🤖 مساعد إبداع سوفت الذكي</h1>

<div class="chat">
  <div class="box" id="chat">
    <div class="msg">
      مرحباً بك 👋 <br>
      أنا مساعد إبداع سوفت، اسألني عن الأنظمة والتهيئة والدعم.
    </div>
  </div>

  <div class="input-container">
    <input id="text" placeholder="اكتب سؤالك هنا..." autofocus>
    <button onclick="send()">إرسال</button>
  </div>

  <!-- زر تواصل واتساب -->
  <a href="https://wa.me/967776724021" target="_blank" style="
  display:block;
  margin-top:20px;
  background:#25d366;
  color:white;
  padding:10px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;">
  💬 تواصل مع الدعم الفني واتساب</a>

</div>

<script>
function send(){
let input = document.getElementById("text");
let chat = document.getElementById("chat");

if(input.value.trim() == "") return;

// حماية النص المدخل وعرض رسالة المستخدم بأمان
let safeText = input.value.replace(/</g,"&lt;").replace(/>/g,"&gt;");
chat.innerHTML += "<div class='msg'>👤 " + safeText + "</div>";

// منطق الردود لأنظمة إبداع سوفت
let question = input.value.toLowerCase();
let answer = "يمكنني مساعدتك في شرح أنظمة إبداع سوفت والتهيئة والدعم الفني.";

if(question.includes("دوت") || question.includes("dotx")){
    answer = "نظام دوت اكس برو هو نظام محاسبي وإداري متكامل يدعم الفروع والمخازن والتقارير المالية والصلاحيات.";
} else if(question.includes("مخزن") || question.includes("اصناف")){
    answer = "لتهيئة المخازن: من القائمة الرئيسية افتح المخازن، أضف المستودعات، ثم قم بإضافة مجموعات الأصناف والأصناف.";
} else if(question.includes("حساب") || question.includes("شجرة")){
    answer = "لتهيئة دليل الحسابات: افتح الحسابات ثم دليل الحسابات ثم أضف الحسابات الرئيسية والفرعية واحفظ.";
} else if(question.includes("سعر") || question.includes("عرض")){
    answer = "للحصول على الأسعار والعروض تواصل مع إبداع سوفت فرع الحديدة عبر واتساب 776724021.";
} else if(question.includes("مدارس")){
    answer = "نظام المدارس يساعد في إدارة الطلاب، الرسوم، الدرجات، الموظفين والجداول.";
}

// عرض رد المساعد
chat.innerHTML += "<div class='msg'>🤖 " + answer + "</div>";

input.value = "";
chat.scrollTop = chat.scrollHeight;
}

// تفعيل الإرسال بزر Enter
document.getElementById("text").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
